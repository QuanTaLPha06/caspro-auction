<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cascadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Outer Orbit Swoosh -->
  <path d="M 60 350 C 40 180, 240 80, 420 160 C 450 175, 410 240, 310 290 C 220 335, 120 370, 60 350 Z" 
        fill="url(#cascadeGrad)" opacity="0.9" />
  
  <path d="M 50 360 C 20 200, 220 70, 440 140" 
        fill="none" stroke="#6b21a8" stroke-width="8" stroke-linecap="round" />

  <!-- 31 Brush Calligraphy (Simplified Vector Representation) -->
  <!-- '3' -->
  <path d="M 140 160 C 180 130, 240 145, 230 190 C 220 225, 175 235, 160 240 C 210 245, 255 265, 240 320 C 220 380, 130 360, 110 320" 
        fill="none" stroke="url(#brushGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- '1' -->
  <path d="M 285 200 L 340 140 L 305 370" 
        fill="none" stroke="url(#brushGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkles -->
  <!-- Sparkle 1 -->
  <path d="M 430 85 Q 430 105 440 105 Q 430 105 430 125 Q 430 105 420 105 Q 430 105 430 85 Z" fill="url(#sparkleGrad)" />
  <!-- Sparkle 2 -->
  <path d="M 390 120 Q 390 135 400 135 Q 390 135 390 150 Q 390 135 380 135 Q 390 135 390 120 Z" fill="url(#sparkleGrad)" />
  <!-- Sparkle 3 -->
  <path d="M 450 140 Q 450 150 455 150 Q 450 150 450 160 Q 450 150 445 150 Q 450 150 450 140 Z" fill="url(#sparkleGrad)" />
  <circle cx="410" cy="60" r="4" fill="#a855f7" />
  <circle cx="460" cy="120" r="3" fill="#c084fc" />
  <circle cx="445" cy="180" r="2.5" fill="#e9d5ff" />

  <!-- Text CASCADE -->
  <text x="250" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="900" font-size="42" letter-spacing="18" fill="#1e1b4b">
    CASCADE
  </text>
</svg>
